# Base values for apidocs-api-chart
# These values should never change between environments or over time

replicaCount: 1

image:
  registry: ghcr.io/bouc-io
  repository: application/apidocs/apidocs-api-server
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Scraped by Prometheus for app-level metrics at /metrics. Port matches the container.
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "3000"
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources: {}

# Probes hit /healthz, which returns 200 whenever the process is up. A failing upstream
# must NOT fail our probe: this service is still useful (and its other specs still load)
# when one upstream is down.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Default environment variables (can be overridden per environment)
environment:
  PORT: 3000
  # OpenTelemetry — service.name surfaces in Jaeger/Grafana.
  OTEL_SERVICE_NAME: "apidocs-api-server"
  # Overridden from the cluster-vars ConfigMap via the HelmRelease (Flux postBuild).
  ENVIRONMENT_ID: "unknown"
  LOG_LEVEL: "info"
  # How long a fetched spec is reused before refetching (ms).
  SPEC_TTL_MS: 300000
  # Per-upstream HTTP timeout (ms).
  SPEC_FETCH_TIMEOUT_MS: 5000
  # Upstream services whose OpenAPI specs are aggregated. These are the *-api-chart
  # services (the APIs); *-chart-service names belong to the UIs. All east-west traffic:
  # none of these /openapi.json paths are routed at the Istio edge.
  AGENT_API_URL: "http://agent-api-chart.default.svc.cluster.local:80"
  MEMORY_API_URL: "http://memory-api-chart.default.svc.cluster.local:80"
  ADMIN_API_URL: "http://admin-api-chart.default.svc.cluster.local:80"
  PORTAL_API_URL: "http://portal-api-chart.default.svc.cluster.local:80"
  CHATBOT_API_URL: "http://chatbot-api-chart.default.svc.cluster.local:80"
  DISTILLER_API_URL: "http://memory-distiller-chart.default.svc.cluster.local:80"
