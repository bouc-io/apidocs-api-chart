apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apidocs-api-chart.fullname" . }}
  labels:
    {{- include "apidocs-api-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "apidocs-api-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "apidocs-api-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with include "apidocs-api-chart.imagePullSecrets" . | fromYamlArray }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "apidocs-api-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "apidocs-api-chart.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.environment.PORT }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.environment.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.environment.PORT | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.environment.LOG_LEVEL | default "info" | quote }}
            # Spec cache behaviour. Specs are fetched lazily and reused until the TTL
            # expires, so a redeployed upstream shows new endpoints without restarting us.
            - name: SPEC_TTL_MS
              value: {{ .Values.environment.SPEC_TTL_MS | default 300000 | quote }}
            - name: SPEC_FETCH_TIMEOUT_MS
              value: {{ .Values.environment.SPEC_FETCH_TIMEOUT_MS | default 5000 | quote }}
            # Upstream services whose OpenAPI specs are aggregated. East-west only: these
            # /openapi.json paths are not routed at the Istio edge.
            - name: AGENT_API_URL
              value: {{ .Values.environment.AGENT_API_URL | quote }}
            - name: MEMORY_API_URL
              value: {{ .Values.environment.MEMORY_API_URL | quote }}
            - name: ADMIN_API_URL
              value: {{ .Values.environment.ADMIN_API_URL | quote }}
            - name: PORTAL_API_URL
              value: {{ .Values.environment.PORTAL_API_URL | quote }}
            - name: CHATBOT_API_URL
              value: {{ .Values.environment.CHATBOT_API_URL | quote }}
            - name: DISTILLER_API_URL
              value: {{ .Values.environment.DISTILLER_API_URL | quote }}
            # OpenTelemetry — OTLP endpoint points at the node-local collector, which is a
            # hostNetwork daemonset, so it is reached via the node IP (downward API),
            # NOT a ClusterIP service.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.environment.OTEL_SERVICE_NAME | quote }}
            # Stamped on direct-scraped /metrics so they line up with the collector-routed
            # otel_* series. Sourced from the cluster-vars ConfigMap via the HelmRelease.
            - name: ENVIRONMENT_ID
              value: {{ .Values.environment.ENVIRONMENT_ID | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
